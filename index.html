<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Label Design Studio - 2 Zone</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 10px; display: flex; flex-direction: column; align-items: center; }
    h3 { font-size: 0.95rem; margin: 6px 0; color: #38bdf8; text-transform: uppercase; letter-spacing: 0.5px; }
    
    .section-box {
      width: 100%;
      max-width: 600px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .toolbar { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; width: 100%; margin-bottom: 6px; }
    
    .btn { 
      background: #3b82f6; color: white; border: none; padding: 6px 10px; 
      border-radius: 4px; font-size: 0.75rem; font-weight: 600; cursor: pointer; 
      display: inline-flex; align-items: center; touch-action: manipulation;
    }
    .btn-green { background: #10b981; }
    .btn-orange { background: #f59e0b; }
    .btn-purple { background: #8b5cf6; }
    .btn-red { background: #ef4444; }

    input[type="color"] { border: none; width: 28px; height: 28px; border-radius: 4px; cursor: pointer; }
    
    .canvas-container { border: 1px dashed #475569; background: #ffffff; border-radius: 4px; }
  </style>
</head>
<body>

  <!-- KANVAS UTAMA (BAGIAN 1) -->
  <div class="section-box">
    <h3>1. Kanvas Utama (Hasil Label)</h3>
    <div class="toolbar">
      <label class="btn btn-purple">
        + Background <input type="file" id="loadMainBg" accept="image/*" hidden>
      </label>
      <button class="btn btn-orange" onclick="mergeSelected()">Gabung (Lock)</button>
      <button class="btn btn-orange" onclick="unmergeSelected()">Lepas (Unlock)</button>
      <button class="btn btn-red" onclick="deleteMainObj()">Hapus</button>
      <button class="btn btn-green" onclick="exportPNG()">Unduh PNG</button>
    </div>
    <canvas id="mainCanvas" width="500" height="250"></canvas>
  </div>

  <!-- STAGING AREA (BAGIAN 2) -->
  <div class="section-box">
    <h3>2. Meja Potong & Olah Gambar (Staging Area)</h3>
    <div class="toolbar">
      <label class="btn btn-purple">
        + Gambar B <input type="file" id="loadStagingImg" accept="image/*" hidden>
      </label>
      <button class="btn" onclick="addStagingText()">+ Teks Seni</button>
      <input type="color" id="textColor" value="#ff0000" title="Warna Teks">
      <button class="btn btn-green" onclick="cropStaging('square')">Potong Siku</button>
      <button class="btn btn-green" onclick="cropStaging('rounded')">Potong Lengkung</button>
      <button class="btn btn-green" onclick="cropStaging('circle')">Potong Lingkaran</button>
      <button class="btn btn-purple" style="width:100%; margin-top:4px;" onclick="sendToMain()">
        ⬆️ Kirim Elemen Ke Kanvas Utama
      </button>
    </div>
    <canvas id="stagingCanvas" width="500" height="200"></canvas>
  </div>

  <script>
    // Inisialisasi Dua Canvas
    const mainCanvas = new fabric.Canvas('mainCanvas', { backgroundColor: '#ffffff' });
    const stagingCanvas = new fabric.Canvas('stagingCanvas', { backgroundColor: '#f8fafc' });

    // --- BAGIAN 2: STAGING AREA (PENGOLAHAN) ---

    // 1. Upload Gambar B ke Staging Area
    document.getElementById('loadStagingImg').addEventListener('change', function(e) {
      if (!e.target.files[0]) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        fabric.Image.fromURL(event.target.result, function(img) {
          img.scaleToWidth(140);
          stagingCanvas.add(img);
          stagingCanvas.setActiveObject(img);
          stagingCanvas.renderAll();
        });
      };
      reader.readAsDataURL(e.target.files[0]);
    });

    // 2. Tambah Teks Seni di Staging Area
    function addStagingText() {
      const txt = prompt("Masukkan Teks Seni:", "Varian Rasa");
      if (!txt) return;
      const textObj = new fabric.IText(txt, {
        left: 50, top: 50,
        fontSize: 24,
        fill: document.getElementById('textColor').value,
        fontWeight: 'bold',
        stroke: '#000000',
        strokeWidth: 1
      });
      stagingCanvas.add(textObj);
      stagingCanvas.setActiveObject(textObj);
      stagingCanvas.renderAll();
    }

    // 3. Pemotongan Gambar B di Staging Area
    function cropStaging(shape) {
      const activeObj = stagingCanvas.getActiveObject();
      if (!activeObj || activeObj.type !== 'image') {
        alert("Pilih gambar di Meja Potong terlebih dahulu!");
        return;
      }
      let clipShape;
      const w = activeObj.width;
      const h = activeObj.height;

      if (shape === 'square') {
        clipShape = new fabric.Rect({ left: -w/4, top: -h/4, width: w/2, height: h/2, originX: 'left', originY: 'top' });
      } else if (shape === 'rounded') {
        clipShape = new fabric.Rect({ left: -w/4, top: -h/4, width: w/2, height: h/2, rx: 20, ry: 20, originX: 'left', originY: 'top' });
      } else if (shape === 'circle') {
        clipShape = new fabric.Circle({ radius: Math.min(w, h)/4, originX: 'center', originY: 'center' });
      }

      activeObj.set('clipPath', clipShape);
      stagingCanvas.renderAll();
    }

    // 4. Transfer Elemen dari Staging ke Kanvas Utama
    function sendToMain() {
      const activeObj = stagingCanvas.getActiveObject();
      if (!activeObj) {
        alert("Pilih elemen di Meja Potong yang ingin dikirim!");
        return;
      }
      activeObj.clone(function(clonedObj) {
        clonedObj.set({ left: 50, top: 50 });
        mainCanvas.add(clonedObj);
        mainCanvas.setActiveObject(clonedObj);
        mainCanvas.renderAll();
      });
    }

    // --- BAGIAN 1: KANVAS UTAMA ---

    // 1. Upload Background Label Utama
    document.getElementById('loadMainBg').addEventListener('change', function(e) {
      if (!e.target.files[0]) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        fabric.Image.fromURL(event.target.result, function(img) {
          img.scaleToWidth(mainCanvas.width);
          mainCanvas.setBackgroundImage(img, mainCanvas.renderAll.bind(mainCanvas));
        });
      };
      reader.readAsDataURL(e.target.files[0]);
    });

    // 2. Gabungkan Elemen (Group/Lock)
    function mergeSelected() {
      const activeObj = mainCanvas.getActiveObject();
      if (!activeObj || activeObj.type !== 'activeSelection') {
        alert("Pilih minimal 2 elemen di Kanvas Utama (tahan geser/select) untuk menggabungkan!");
        return;
      }
      activeObj.toGroup();
      mainCanvas.renderAll();
    }

    // 3. Lepas Elemen (Ungroup/Unlock)
    function unmergeSelected() {
      const activeObj = mainCanvas.getActiveObject();
      if (!activeObj || activeObj.type !== 'group') {
        alert("Pilih grup elemen yang ingin dilepas!");
        return;
      }
      activeObj.toActiveSelection();
      mainCanvas.renderAll();
    }

    // 4. Hapus Objek di Kanvas Utama
    function deleteMainObj() {
      const activeObj = mainCanvas.getActiveObject();
      if (activeObj) {
        mainCanvas.remove(activeObj);
        mainCanvas.discardActiveObject();
        mainCanvas.renderAll();
      }
    }

    // 5. Ekspor PNG High-Res
    function exportPNG() {
      const dataURL = mainCanvas.toDataURL({ format: 'png', quality: 1.0, multiplier: 2 });
      const link = document.createElement('a');
      link.download = 'label-desain-final.png';
      link.href = dataURL;
      link.click();
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Label Design Studio</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #f0f2f5; display: flex; flex-direction: column; align-items: center; padding: 10px; }
    h2 { font-size: 1.2rem; margin-bottom: 10px; color: #333; text-align: center; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; justify-content: center; width: 100%; max-width: 800px; }
    button, label.btn-upload { background: #4F46E5; color: white; border: none; padding: 8px 10px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; display: inline-flex; align-items: center; }
    input[type="color"] { border: none; border-radius: 4px; height: 32px; width: 32px; cursor: pointer; background: transparent; }
    .canvas-container-box { border: 2px dashed #ccc; background: #fff; overflow: auto; width: 100%; display: flex; justify-content: center; }
  </style>
</head>
<body>

  <h2>Label Design Studio</h2>

  <div class="toolbar">
    <label class="btn-upload">
      + Gambar <input type="file" id="imageLoader" accept="image/*" hidden>
    </label>
    <button onclick="addText()">+ Teks</button>
    <input type="color" id="colorPicker" value="#000000" title="Ubah Warna Teks">
    <button onclick="cropSquare()" style="background:#059669;">Potong Kotak (Siku)</button>
    <button onclick="cropSquareRounded()" style="background:#059669;">Potong Kotak (Lengkung)</button>
    <button onclick="cropCircle()" style="background:#059669;">Potong Lingkaran</button>
    <button onclick="deleteObject()" style="background:#DC2626;">Hapus</button>
    <button onclick="exportLabel()" style="background:#2563EB;">Unduh PNG</button>
  </div>

  <div class="canvas-container-box">
    <canvas id="labelCanvas" width="800" height="400"></canvas>
  </div>

  <script>
    const canvas = new fabric.Canvas('labelCanvas', {
      backgroundColor: '#ffffff'
    });

    // 1. Tambah Gambar
    document.getElementById('imageLoader').addEventListener('change', function(e) {
      if (!e.target.files[0]) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        const imgObj = new Image();
        imgObj.src = event.target.result;
        imgObj.onload = function() {
          const fabricImg = new fabric.Image(imgObj);
          fabricImg.scaleToWidth(200);
          canvas.add(fabricImg);
          canvas.setActiveObject(fabricImg);
          canvas.renderAll();
        }
      }
      reader.readAsDataURL(e.target.files[0]);
    });

    // 2. Tambah Teks
    function addText() {
      const text = new fabric.IText('Teks Label', {
        left: 50,
        top: 50,
        fontSize: 24,
        fill: document.getElementById('colorPicker').value
      });
      canvas.add(text);
      canvas.setActiveObject(text);
      canvas.renderAll();
    }

    // Ubah Warna Teks
    document.getElementById('colorPicker').addEventListener('input', function(e) {
      const activeObject = canvas.getActiveObject();
      if (activeObject && activeObject.type === 'i-text') {
        activeObject.set('fill', e.target.value);
        canvas.renderAll();
      }
    });

    // 3. Potong Kotak (Siku)
    function cropSquare() {
      const activeObj = canvas.getActiveObject();
      if (activeObj && activeObj.type === 'image') {
        const rect = new fabric.Rect({
          left: -activeObj.width / 4,
          top: -activeObj.height / 4,
          width: activeObj.width / 2,
          height: activeObj.height / 2,
          originX: 'left',
          originY: 'top'
        });
        activeObj.set('clipPath', rect);
        canvas.renderAll();
      }
    }

    // 4. Potong Kotak (Lengkung)
    function cropSquareRounded() {
      const activeObj = canvas.getActiveObject();
      if (activeObj && activeObj.type === 'image') {
        const rect = new fabric.Rect({
          left: -activeObj.width / 4,
          top: -activeObj.height / 4,
          width: activeObj.width / 2,
          height: activeObj.height / 2,
          rx: 20,
          ry: 20,
          originX: 'left',
          originY: 'top'
        });
        activeObj.set('clipPath', rect);
        canvas.renderAll();
      }
    }

    // 5. Potong Lingkaran
    function cropCircle() {
      const activeObj = canvas.getActiveObject();
      if (activeObj && activeObj.type === 'image') {
        const radius = Math.min(activeObj.width, activeObj.height) / 4;
        const circle = new fabric.Circle({
          radius: radius,
          originX: 'center',
          originY: 'center'
        });
        activeObj.set('clipPath', circle);
        canvas.renderAll();
      }
    }

    // 6. Hapus Elemen
    function deleteObject() {
      const activeObj = canvas.getActiveObject();
      if (activeObj) {
        canvas.remove(activeObj);
        canvas.discardActiveObject();
        canvas.renderAll();
      }
    }

    // 7. Unduh PNG
    function exportLabel() {
      const dataURL = canvas.toDataURL({ format: 'png', quality: 1.0 });
      const link = document.createElement('a');
      link.download = 'label-design.png';
      link.href = dataURL;
      link.click();
    }
  </script>
</body>
</html>

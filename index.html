<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Label Design Studio - Precision D-Pad & Auto Save</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; touch-action: manipulation; }
    body { background: #0f172a; color: #f8fafc; padding: 10px; display: flex; flex-direction: column; align-items: center; }
    h3 { font-size: 0.95rem; margin: 6px 0; color: #38bdf8; text-transform: uppercase; letter-spacing: 0.5px; }
    
    .section-box {
      width: 100%;
      max-width: 600px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .toolbar { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; width: 100%; margin-bottom: 6px; }
    
    .btn { 
      background: #3b82f6; color: white; border: none; padding: 6px 10px; 
      border-radius: 4px; font-size: 0.75rem; font-weight: 600; cursor: pointer; 
      display: inline-flex; align-items: center; justify-content: center; user-select: none;
    }
    .btn-pink { background: #ec4899; }
    .btn-green { background: #10b981; }
    .btn-orange { background: #f59e0b; }
    .btn-purple { background: #8b5cf6; }
    .btn-red { background: #ef4444; }
    .btn-zoom { background: #0284c7; }
    .btn-ai { background: linear-gradient(135deg, #a855f7, #ec4899); color: white; }

    .color-picker-wrapper { display: flex; align-items: center; gap: 4px; background: #334155; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; }
    input[type="color"] { border: none; width: 24px; height: 24px; border-radius: 4px; cursor: pointer; }
    .canvas-container { border: 1px dashed #475569; background: #ffffff; border-radius: 4px; overflow: hidden; }

    /* PANEL PAPAN KONTROL (D-PAD) */
    .control-panel {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px;
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-around;
      align-items: center;
      gap: 10px;
    }
    .dpad-group { display: flex; flex-direction: column; align-items: center; }
    .dpad-row { display: flex; gap: 4px; }
    .btn-dpad {
      width: 36px; height: 36px; font-size: 1rem; border-radius: 6px;
      background: #334155; color: #f8fafc; border: 1px solid #475569;
    }
    .btn-dpad:active { background: #0284c7; }
    .action-group { display: flex; flex-direction: column; gap: 4px; }
    .action-row { display: flex; gap: 4px; }
    .btn-action { height: 36px; padding: 0 10px; font-size: 0.75rem; background: #1e293b; border: 1px solid #475569; }
    .btn-action:active { background: #ec4899; }
  </style>
</head>
<body>

  <!-- KANVAS UTAMA (BAGIAN 1) -->
  <div class="section-box">
    <h3>1. KANVAS UTAMA (HASIL LABEL)</h3>
    <div class="toolbar">
      <label class="btn btn-purple">
        + Background <input type="file" id="loadMainBg" accept="image/*" hidden>
      </label>
      <button class="btn btn-green" onclick="autoFlattenBg()">Ratakan Label</button>
      <button class="btn btn-pink" onclick="addMagicBox()">✨ + Kotak Sakti</button>
      <button class="btn btn-purple" onclick="duplicateMainObj()">📋 Duplikat</button>

      <button class="btn btn-zoom" onclick="zoomMain(1.2)">🔍 Zoom +</button>
      <button class="btn btn-zoom" onclick="zoomMain(0.8)">🔍 Zoom -</button>
      <button class="btn btn-zoom" onclick="resetZoomMain()">↺ Reset Zoom</button>

      <button class="btn btn-orange" onclick="mergeSelected()">Gabung (Lock)</button>
      <button class="btn btn-orange" onclick="unmergeSelected()">Lepas (Unlock)</button>
      <button class="btn btn-red" onclick="deleteMainObj()">Hapus</button>
      <button class="btn btn-green" onclick="exportPNG()">Unduh PNG</button>
      <button class="btn btn-red" onclick="clearProjectData()" title="Hapus Sesi & Mulai Baru">Reset Proyek</button>
    </div>

    <canvas id="mainCanvas" width="500" height="250"></canvas>

    <!-- PAPAN KONTROL / MOUSE VIRTUAL -->
    <div class="control-panel">
      <!-- D-PAD ARAH GESER -->
      <div class="dpad-group">
        <span style="font-size: 0.7rem; color: #94a3b8; margin-bottom: 2px;">Geser Presisi</span>
        <div class="dpad-row">
          <button class="btn btn-dpad" id="btnUp">⬆️</button>
        </div>
        <div class="dpad-row">
          <button class="btn btn-dpad" id="btnLeft">⬅️</button>
          <button class="btn btn-dpad" id="btnDown">⬇️</button>
          <button class="btn btn-dpad" id="btnRight">➡️</button>
        </div>
      </div>

      <!-- KONTROL UKURAN & ROTASI -->
      <div class="action-group">
        <span style="font-size: 0.7rem; color: #94a3b8; text-align: center;">Ukuran & Rotasi</span>
        <div class="action-row">
          <button class="btn btn-action" id="btnScaleUp">➕ Perbesar</button>
          <button class="btn btn-action" id="btnScaleDown">➖ Perkecil</button>
        </div>
        <div class="action-row">
          <button class="btn btn-action" id="btnRotateCCW">🔄 Putar Kiri</button>
          <button class="btn btn-action" id="btnRotateCW">🔁 Putar Kanan</button>
        </div>
      </div>
    </div>
  </div>

  <!-- STAGING AREA (BAGIAN 2) -->
  <div class="section-box">
    <h3>2. MEJA POTONG & OLAH GAMBAR (STAGING AREA)</h3>
    <div class="toolbar">
      <label class="btn btn-purple">
        + Gambar B <input type="file" id="loadStagingImg" accept="image/*" hidden>
      </label>
      <button class="btn" onclick="addStagingText()">+ Teks Seni</button>
      
      <button class="btn btn-ai" onclick="autoRemoveBgAI()">🤖 AI Auto Hapus BG</button>
      <button class="btn btn-orange" onclick="enableColorPicker()">🧪 Klik Gambar (Pipet)</button>
      
      <div class="color-picker-wrapper">
        <span>Target:</span>
        <input type="color" id="removeColor" value="#ffffff" title="Warna Target">
      </div>
      <button class="btn btn-red" onclick="removeBackgroundStaging()">🪄 Hapus BG Warna</button>

      <button class="btn btn-green" onclick="cropStaging('square')">Potong Siku</button>
      <button class="btn btn-green" onclick="cropStaging('rounded')">Potong Lengkung</button>
      <button class="btn btn-green" onclick="cropStaging('circle')">Potong Lingkaran</button>
      
      <button class="btn btn-purple" style="width:100%; margin-top:4px;" onclick="sendToMain()">
        ⬆️ Masukkan Elemen ke Kotak Sakti / Kanvas
      </button>
    </div>
    <canvas id="stagingCanvas" width="500" height="200"></canvas>
  </div>

  <script>
    const mainCanvas = new fabric.Canvas('mainCanvas', { backgroundColor: '#ffffff' });
    const stagingCanvas = new fabric.Canvas('stagingCanvas', { backgroundColor: '#f8fafc' });

    let currentZoom = 1;
    let pickColorMode = false;

    // ==========================================
    // 1. SISTEM AUTO-SAVE & AUTO-RESTORE
    // ==========================================
    function saveProjectState() {
      try {
        const mainData = JSON.stringify(mainCanvas.toJSON(['isMagicBox']));
        const stagingData = JSON.stringify(stagingCanvas.toJSON());
        localStorage.setItem('label_studio_main', mainData);
        localStorage.setItem('label_studio_staging', stagingData);
      } catch (e) {
        console.warn("Gagal menyimpan otomatis:", e);
      }
    }

    function loadProjectState() {
      const savedMain = localStorage.getItem('label_studio_main');
      const savedStaging = localStorage.getItem('label_studio_staging');

      if (savedMain) {
        mainCanvas.loadFromJSON(savedMain, function() {
          mainCanvas.getObjects().forEach(obj => {
            if (obj.isMagicBox) attachMagicBoxEvents(obj);
          });
          mainCanvas.renderAll();
        });
      }
      if (savedStaging) {
        stagingCanvas.loadFromJSON(savedStaging, function() {
          stagingCanvas.renderAll();
        });
      }
    }

    function clearProjectData() {
      if (confirm("Yakin ingin menghapus seluruh progres dan mulai dari awal?")) {
        localStorage.removeItem('label_studio_main');
        localStorage.removeItem('label_studio_staging');
        location.reload();
      }
    }

    // Auto save setiap kali terjadi perubahan kanvas
    mainCanvas.on('object:modified', saveProjectState);
    mainCanvas.on('object:added', saveProjectState);
    mainCanvas.on('object:removed', saveProjectState);
    stagingCanvas.on('object:modified', saveProjectState);
    stagingCanvas.on('object:added', saveProjectState);
    stagingCanvas.on('object:removed', saveProjectState);

    // ==========================================
    // 2. SISTEM PAPAN KONTROL (HOLD / TAP CONTINUOUS)
    // ==========================================
    function bindContinuousControl(buttonId, actionFunction) {
      const btn = document.getElementById(buttonId);
      let timer = null;

      const start = (e) => {
        e.preventDefault();
        actionFunction(); // Eksekusi tap pertama
        timer = setInterval(actionFunction, 60); // Tahan untuk eksekusi berulang
      };

      const stop = (e) => {
        e.preventDefault();
        if (timer) clearInterval(timer);
        timer = null;
        saveProjectState();
      };

      btn.addEventListener('mousedown', start);
      btn.addEventListener('mouseup', stop);
      btn.addEventListener('mouseleave', stop);
      btn.addEventListener('touchstart', start);
      btn.addEventListener('touchend', stop);
    }

    // Fungsi Transformasi Objek Terpilih
    function moveSelected(dx, dy) {
      const obj = mainCanvas.getActiveObject();
      if (!obj) return;
      obj.set({ left: obj.left + dx, top: obj.top + dy });
      mainCanvas.renderAll();
    }

    function scaleSelected(factor) {
      const obj = mainCanvas.getActiveObject();
      if (!obj) return;
      obj.scale(obj.scaleX * factor);
      mainCanvas.renderAll();
    }

    function rotateSelected(angle) {
      const obj = mainCanvas.getActiveObject();
      if (!obj) return;
      obj.set('angle', obj.angle + angle);
      mainCanvas.renderAll();
    }

    // Binding Tombol Kontrol
    bindContinuousControl('btnUp', () => moveSelected(0, -2));
    bindContinuousControl('btnDown', () => moveSelected(0, 2));
    bindContinuousControl('btnLeft', () => moveSelected(-2, 0));
    bindContinuousControl('btnRight', () => moveSelected(2, 0));

    bindContinuousControl('btnScaleUp', () => scaleSelected(1.02));
    bindContinuousControl('btnScaleDown', () => scaleSelected(0.98));
    bindContinuousControl('btnRotateCCW', () => rotateSelected(-2));
    bindContinuousControl('btnRotateCW', () => rotateSelected(2));


    // ==========================================
    // 3. FITUR KOTAK SAKTI & DUPLIKAT
    // ==========================================
    function attachMagicBoxEvents(magicBox) {
      let lastClickTime = 0;
      magicBox.on('mousedown', function() {
        const currentTime = new Date().getTime();
        if (currentTime - lastClickTime < 300) {
          duplicateMainObj();
        }
        lastClickTime = currentTime;
      });
    }

    function addMagicBox() {
      const rect = new fabric.Rect({
        width: 120, height: 120,
        fill: 'rgba(236, 72, 153, 0.1)', stroke: '#ec4899', strokeWidth: 2,
        strokeDashArray: [6, 6], originX: 'center', originY: 'center'
      });
      const plusText = new fabric.Text('+', {
        fontSize: 26, fill: '#ec4899', originX: 'center', originY: 'center', fontWeight: 'bold'
      });
      const magicBox = new fabric.Group([rect, plusText], {
        left: mainCanvas.width / 2, top: mainCanvas.height / 2,
        originX: 'center', originY: 'center', centeredScaling: true,
        transparentCorners: false, cornerColor: '#ec4899', cornerStyle: 'circle'
      });

      magicBox.isMagicBox = true;
      attachMagicBoxEvents(magicBox);

      mainCanvas.add(magicBox);
      mainCanvas.setActiveObject(magicBox);
      mainCanvas.renderAll();
    }

    function duplicateMainObj() {
      const activeObj = mainCanvas.getActiveObject();
      if (!activeObj) {
        alert("Pilih Kotak Sakti atau elemen yang ingin diduplikat terlebih dahulu!");
        return;
      }

      activeObj.clone(function(clonedObj) {
        clonedObj.set({
          left: activeObj.left + 20,
          top: activeObj.top + 20,
          evented: true
        });

        if (activeObj.isMagicBox) {
          clonedObj.isMagicBox = true;
          attachMagicBoxEvents(clonedObj);
        }

        mainCanvas.add(clonedObj);
        mainCanvas.setActiveObject(clonedObj);
        mainCanvas.renderAll();
      });
    }

    function sendToMain() {
      const activeStagingObj = stagingCanvas.getActiveObject();
      if (!activeStagingObj) {
        alert("Pilih elemen di Meja Potong terlebih dahulu!");
        return;
      }

      const activeMainObj = mainCanvas.getActiveObject();

      activeStagingObj.clone(function(clonedObj) {
        if (activeMainObj && activeMainObj.isMagicBox) {
          const targetWidth = activeMainObj.getScaledWidth();
          const targetHeight = activeMainObj.getScaledHeight();
          const targetLeft = activeMainObj.left;
          const targetTop = activeMainObj.top;

          const scaleX = targetWidth / clonedObj.width;
          const scaleY = targetHeight / clonedObj.height;
          const finalScale = Math.min(scaleX, scaleY);

          clonedObj.set({
            left: targetLeft,
            top: targetTop,
            scaleX: finalScale,
            scaleY: finalScale,
            originX: 'center',
            originY: 'center'
          });

          mainCanvas.remove(activeMainObj);
        } else {
          clonedObj.set({
            left: mainCanvas.width / 2,
            top: mainCanvas.height / 2,
            originX: 'center',
            originY: 'center'
          });
        }

        mainCanvas.add(clonedObj);
        mainCanvas.setActiveObject(clonedObj);
        mainCanvas.renderAll();
      });
    }

    // ==========================================
    // 4. OLAH GAMBAR & STAGING AREA
    // ==========================================
    async function autoRemoveBgAI() {
      const activeObj = stagingCanvas.getActiveObject();
      if (!activeObj || activeObj.type !== 'image') {
        alert("Silakan pilih/klik Gambar B di Meja Potong terlebih dahulu!");
        return;
      }

      const originalElement = activeObj._element;
      if (!originalElement) return;

      const tempCanvas = document.createElement('canvas');
      const tempCtx = tempCanvas.getContext('2d');
      tempCanvas.width = originalElement.naturalWidth || originalElement.width;
      tempCanvas.height = originalElement.naturalHeight || originalElement.height;
      tempCtx.drawImage(originalElement, 0, 0);

      const imgData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
      const data = imgData.data;

      const corners = [
        0,
        (tempCanvas.width - 1) * 4,
        (tempCanvas.height - 1) * tempCanvas.width * 4,
        ((tempCanvas.height - 1) * tempCanvas.width + (tempCanvas.width - 1)) * 4
      ];

      let bgR = 0, bgG = 0, bgB = 0;
      corners.forEach(idx => {
        bgR += data[idx];
        bgG += data[idx + 1];
        bgB += data[idx + 2];
      });
      bgR = Math.round(bgR / 4);
      bgG = Math.round(bgG / 4);
      bgB = Math.round(bgB / 4);

      const threshold = 60;
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];
        const diff = Math.sqrt((r - bgR) ** 2 + (g - bgG) ** 2 + (b - bgB) ** 2);
        if (diff < threshold) {
          data[i + 3] = 0;
        }
      }

      tempCtx.putImageData(imgData, 0, 0);

      fabric.Image.fromURL(tempCanvas.toDataURL(), function(newImg) {
        newImg.set({
          left: activeObj.left,
          top: activeObj.top,
          scaleX: activeObj.scaleX,
          scaleY: activeObj.scaleY,
          angle: activeObj.angle
        });
        stagingCanvas.remove(activeObj);
        stagingCanvas.add(newImg);
        stagingCanvas.setActiveObject(newImg);
        stagingCanvas.renderAll();
      });
    }

    function enableColorPicker() {
      pickColorMode = true;
      alert("Sentuh/Klik area warna background di gambar Meja Potong!");
    }

    stagingCanvas.on('mouse:down', function(options) {
      if (!pickColorMode) return;
      const pointer = stagingCanvas.getPointer(options.e);
      const ctx = stagingCanvas.getContext();
      const pixel = ctx.getImageData(Math.round(pointer.x), Math.round(pointer.y), 1, 1).data;
      const hexColor = "#" + ((1 << 24) + (pixel[0] << 16) + (pixel[1] << 8) + pixel[2]).toString(16).slice(1);
      document.getElementById('removeColor').value = hexColor;
      pickColorMode = false;
      removeBackgroundStaging();
    });

    function removeBackgroundStaging() {
      const activeObj = stagingCanvas.getActiveObject();
      if (!activeObj || activeObj.type !== 'image') return;
      const targetColor = document.getElementById('removeColor').value;
      const removeColorFilter = new fabric.Image.filters.RemoveColor({
        color: targetColor,
        distance: 0.2
      });
      activeObj.filters = [removeColorFilter];
      activeObj.applyFilters();
      stagingCanvas.renderAll();
    }

    function zoomMain(factor) {
      currentZoom *= factor;
      if (currentZoom < 0.5) currentZoom = 0.5;
      if (currentZoom > 4) currentZoom = 4;
      const center = mainCanvas.getCenter();
      mainCanvas.zoomToPoint({ x: center.left, y: center.top }, currentZoom);
      mainCanvas.renderAll();
    }

    function resetZoomMain() {
      currentZoom = 1;
      mainCanvas.setViewportTransform([1, 0, 0, 1, 0, 0]);
      mainCanvas.renderAll();
    }

    function autoFlattenBg() {
      const bg = mainCanvas.backgroundImage;
      if (!bg) {
        alert("Upload gambar Background terlebih dahulu!");
        return;
      }
      bg.set({
        scaleX: mainCanvas.width / bg.width,
        scaleY: mainCanvas.height / bg.height,
        left: 0, top: 0, originX: 'left', originY: 'top', angle: 0
      });
      mainCanvas.renderAll();
    }

    document.getElementById('loadMainBg').addEventListener('change', function(e) {
      if (!e.target.files[0]) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        fabric.Image.fromURL(event.target.result, function(img) {
          img.scaleToWidth(mainCanvas.width);
          mainCanvas.setBackgroundImage(img, function() { 
            autoFlattenBg(); 
            saveProjectState();
          });
        });
      };
      reader.readAsDataURL(e.target.files[0]);
    });

    document.getElementById('loadStagingImg').addEventListener('change', function(e) {
      if (!e.target.files[0]) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        fabric.Image.fromURL(event.target.result, function(img) {
          img.scaleToWidth(140);
          stagingCanvas.add(img);
          stagingCanvas.setActiveObject(img);
          stagingCanvas.renderAll();
        });
      };
      reader.readAsDataURL(e.target.files[0]);
    });

    function addStagingText() {
      const txt = prompt("Masukkan Teks Seni:", "Varian Rasa");
      if (!txt) return;
      const textObj = new fabric.IText(txt, {
        left: 50, top: 50, fontSize: 24, fill: '#ff0000',
        fontWeight: 'bold', stroke: '#000000', strokeWidth: 1
      });
      stagingCanvas.add(textObj);
      stagingCanvas.setActiveObject(textObj);
      stagingCanvas.renderAll();
    }

    function cropStaging(shape) {
      const activeObj = stagingCanvas.getActiveObject();
      if (!activeObj || activeObj.type !== 'image') return;
      let clipShape;
      const w = activeObj.width, h = activeObj.height;

      if (shape === 'square') {
        clipShape = new fabric.Rect({ left: -w/4, top: -h/4, width: w/2, height: h/2, originX: 'left', originY: 'top' });
      } else if (shape === 'rounded') {
        clipShape = new fabric.Rect({ left: -w/4, top: -h/4, width: w/2, height: h/2, rx: 20, ry: 20, originX: 'left', originY: 'top' });
      } else if (shape === 'circle') {
        clipShape = new fabric.Circle({ radius: Math.min(w, h)/4, originX: 'center', originY: 'center' });
      }

      activeObj.set('clipPath', clipShape);
      stagingCanvas.renderAll();
    }

    function mergeSelected() {
      const activeObj = mainCanvas.getActiveObject();
      if (!activeObj || activeObj.type !== 'activeSelection') return;
      activeObj.toGroup();
      mainCanvas.renderAll();
    }

    function unmergeSelected() {
      const activeObj = mainCanvas.getActiveObject();
      if (!activeObj || activeObj.type !== 'group') return;
      activeObj.toActiveSelection();
      mainCanvas.renderAll();
    }

    function deleteMainObj() {
      const activeObj = mainCanvas.getActiveObject();
      if (activeObj) {
        mainCanvas.remove(activeObj);
        mainCanvas.discardActiveObject();
        mainCanvas.renderAll();
      }
    }

    function exportPNG() {
      const tempZoom = currentZoom;
      resetZoomMain();
      const dataURL = mainCanvas.toDataURL({ format: 'png', quality: 1.0, multiplier: 2 });
      if (tempZoom !== 1) zoomMain(tempZoom);
      const link = document.createElement('a');
      link.download = 'label-desain-final.png';
      link.href = dataURL;
      link.click();
    }

    // Panggil Auto Restore saat aplikasi dibuka
    window.onload = loadProjectState;
  </script>
</body>
</html>

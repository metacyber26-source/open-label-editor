<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Label Studio - Editor 2 Bagian</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-layout">
    
    <!-- ========================================== -->
    <!-- BAGIAN 1: KANVAS UTAMA (HASIL LABEL)       -->
    <!-- ========================================== -->
    <section class="section-container section-top">
      <div class="section-header">
        <h3>1. KANVAS UTAMA (HASIL LABEL)</h3>
      </div>
      
      <!-- Toolbar Bagian 1 -->
      <div class="toolbar-grid">
        <button class="btn btn-purple" onclick="tambahBackground()">+ Background</button>
        <button class="btn btn-green" onclick="ratakanLabel()">Ratakan Label</button>
        <button class="btn btn-pink" onclick="tambahKotakSakti()">✨ + Kotak Sakti</button>
        <button class="btn btn-blue" onclick="zoomIn()">🔍 Zoom +</button>
        <button class="btn btn-blue" onclick="zoomOut()">🔍 Zoom -</button>
        <button class="btn btn-blue" onclick="resetZoom()">↺ Reset Zoom</button>
        <button class="btn btn-orange" onclick="gabungLock()">Gabung (Lock)</button>
        <button class="btn btn-yellow" onclick="lepasUnlock()">Lepas (Unlock)</button>
        <button class="btn btn-red" onclick="hapusElemen()">Hapus</button>
        <button class="btn btn-teal" onclick="unduhPNG()">Unduh PNG</button>
      </div>

      <!-- Area Lembar Kerja Kanvas Putih -->
      <div class="canvas-viewport">
        <div id="kanvas-utama" class="kanvas-putih">
          <!-- Elemen / Kotak Sakti akan muncul di sini -->
          <div id="kotak-sakti" class="kotak-sakti-box">
            <div class="handle handle-top"></div>
            <div class="handle handle-bottom"></div>
            <div class="handle handle-left"></div>
            <div class="handle handle-right"></div>
            <div class="handle handle-top-left"></div>
            <div class="handle handle-top-right"></div>
            <div class="handle handle-bottom-left"></div>
            <div class="handle handle-bottom-right"></div>
            <div class="handle handle-rotate"></div>
            <div class="center-cross">+</div>
          </div>
        </div>
      </div>
    </section>


    <!-- ========================================== -->
    <!-- BAGIAN 2: MEJA POTONG & OLAH GAMBAR       -->
    <!-- ========================================== -->
    <section class="section-container section-bottom">
      <div class="section-header">
        <h3>2. MEJA POTONG & OLAH GAMBAR (STAGING AREA)</h3>
      </div>

      <!-- Toolbar Bagian 2 -->
      <div class="toolbar-grid">
        <button class="btn btn-purple" onclick="uploadGambar()">+ Gambar B</button>
        <button class="btn btn-blue" onclick="tambahTeksSeni()">+ Teks Seni</button>
        <button class="btn btn-pink" onclick="autoHapusBGAI()">🤖 AI Auto Hapus BG</button>
        <button class="btn btn-orange" onclick="aktifkanPipet()">🧪 Klik Gambar (Pipet)</button>
        <div class="target-color-box">
          <span>Target:</span>
          <div id="color-preview" class="color-preview"></div>
        </div>
        <button class="btn btn-red" onclick="hapusBGWarna()">🪄 Hapus BG Warna</button>
        <button class="btn btn-teal" onclick="potongSiku()">Potong Siku</button>
        <button class="btn btn-teal" onclick="potongLengkung()">Potong Lengkung</button>
        <button class="btn btn-teal" onclick="potongLingkaran()">Potong Lingkaran</button>
      </div>

      <!-- Tombol Utama Masukkan ke Kanvas -->
      <div class="full-width-action">
        <button class="btn btn-purple-large" onclick="masukkanKeKanvas()">
          ⬆️ Masukkan Elemen ke Kotak Sakti / Kanvas
        </button>
      </div>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>

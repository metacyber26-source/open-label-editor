l<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Label Design Studio - Ultimate Pro & AI Edition</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: manipulation; }
    body { background: #0f172a; color: #f8fafc; padding: 10px; display: flex; flex-direction: column; align-items: center; }
    
    .dashboard-header {
      width: 100%; max-width: 600px; background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid #38bdf8; border-radius: 8px; padding: 10px 14px; margin-bottom: 10px;
      display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
    }
    .dash-title { font-size: 0.9rem; font-weight: bold; color: #38bdf8; }
    .dash-stats { display: flex; gap: 8px; font-size: 0.75rem; }
    .stat-badge { background: #334155; padding: 4px 8px; border-radius: 4px; border: 1px solid #475569; }
    .stat-badge span { color: #10b981; font-weight: bold; }

    .section-box {
      width: 100%; max-width: 600px; background: #1e293b; border: 1px solid #334155;
      border-radius: 8px; padding: 10px; margin-bottom: 10px; display: flex; flex-direction: column; align-items: center;
    }

    h3 { font-size: 0.85rem; margin-bottom: 8px; color: #38bdf8; text-transform: uppercase; letter-spacing: 0.5px; width: 100%; text-align: left; }

    .toolbar { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; width: 100%; margin-bottom: 8px; }
    
    .btn { 
      background: #3b82f6; color: white; border: none; padding: 6px 10px; 
      border-radius: 4px; font-size: 0.75rem; font-weight: 600; cursor: pointer; 
      display: inline-flex; align-items: center; justify-content: center; user-select: none;
    }
    .btn-pink { background: #ec4899; }
    .btn-green { background: #10b981; }
    .btn-orange { background: #f59e0b; }
    .btn-purple { background: #8b5cf6; }
    .btn-red { background: #ef4444; }
    .btn-cyan { background: #06b6d4; }
    .btn-zoom { background: #0284c7; }
    .btn-ai { background: linear-gradient(135deg, #a855f7, #ec4899); color: white; }

    .color-picker-wrapper { display: flex; align-items: center; gap: 4px; background: #334155; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; }
    input[type="color"] { border: none; width: 22px; height: 22px; border-radius: 4px; cursor: pointer; background: transparent; }
    .canvas-container { border: 1px dashed #475569; background: #ffffff; border-radius: 4px; overflow: hidden; }

    .control-panel {
      width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 6px;
      padding: 8px; margin-top: 8px; display: flex; flex-wrap: wrap; justify-content: space-around; align-items: center; gap: 8px;
    }
    .dpad-group { display: flex; flex-direction: column; align-items: center; }
    .dpad-row { display: flex; gap: 4px; }
    .btn-dpad {
      width: 34px; height: 34px; font-size: 0.9rem; border-radius: 6px;
      background: #334155; color: #f8fafc; border: 1px solid #475569; cursor: pointer;
    }
    .btn-dpad:active { background: #0284c7; }
    .action-group { display: flex; flex-direction: column; gap: 4px; }
    .action-row { display: flex; gap: 4px; }
    .btn-action { height: 34px; padding: 0 8px; font-size: 0.72rem; background: #1e293b; border: 1px solid #475569; color: white; cursor: pointer; border-radius: 4px; }
    .btn-action:active { background: #ec4899; }

    .gallery-container {
      width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 6px; margin-bottom: 8px;
    }
    .gallery-title { font-size: 0.75rem; color: #94a3b8; margin-bottom: 4px; display: flex; justify-content: space-between; }
    .gallery-grid { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
    .gallery-item {
      position: relative; flex: 0 0 55px; height: 55px; border: 1px solid #475569;
      border-radius: 4px; overflow: hidden; background: #1e293b; cursor: pointer;
    }
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; }
    .gallery-item .btn-del-asset {
      position: absolute; top: 2px; right: 2px; background: rgba(239, 68, 68, 0.9);
      color: white; border: none; border-radius: 50%; width: 16px; height: 16px; font-size: 10px; line-height: 16px; text-align: center; cursor: pointer;
    }
    
    .inline-tool-box {
      width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 8px; margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    }
    .inline-input { background: #1e293b; border: 1px solid #475569; color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; flex: 1; min-width: 100px; }
  </style>
</head>
<body>

  <div class="dashboard-header">
    <div class="dash-title">🏷️ Studio Label Pro</div>
    <div class="dash-stats">
      <div class="stat-badge">Pengguna: <span id="userCount">1</span> Active</div>
      <div class="stat-badge">Status: <span style="color:#ec4899;">Owner PRO</span></div>
    </div>
  </div>

  <div class="section-box">
    <h3>1. KANVAS UTAMA (HASIL LABEL FINAL)</h3>
    <div class="toolbar">
      <label class="btn btn-purple">
        + Upload BG <input type="file" id="loadMainBg" accept="image/*" hidden>
      </label>
      <button class="btn btn-green" onclick="autoFlattenBg()">Ratakan Label</button>
      <button class="btn btn-pink" onclick="addMagicBox()">✨ + Kotak Sakti</button>
      <button class="btn btn-cyan" onclick="addLicenseBox()">📜 + Kotak Lisensi</button>
      <button class="btn btn-purple" onclick="duplicateMainObj()">📋 Duplikat</button>

      <button class="btn btn-zoom" onclick="zoomMain(1.2)">🔍 Zoom +</button>
      <button class="btn btn-zoom" onclick="zoomMain(0.8)">🔍 Zoom -</button>
      <button class="btn btn-zoom" onclick="resetZoomMain()">↺ Reset</button>

      <button class="btn btn-orange" onclick="equalizeSelectedSizes()">⚖️ Samakan Ukuran</button>
      <button class="btn btn-orange" onclick="mergeSelected()">Gabung</button>
      <button class="btn btn-orange" onclick="unmergeSelected()">Lepas</button>
      <button class="btn btn-red" onclick="deleteMainObj()">Hapus</button>
      <button class="btn btn-green" onclick="exportPNG()">Unduh PNG</button>
      <button class="btn btn-red" onclick="clearProjectData()" title="Mulai Baru">Reset</button>
    </div>

    <div class="inline-tool-box">
      <span style="font-size:0.7rem; color:#38bdf8; font-weight:bold;">📍 Auto Posisi Lisensi:</span>
      <button class="btn btn-cyan" onclick="autoPlaceLicense('top-right')">Kanan Atas</button>
      <button class="btn btn-cyan" onclick="autoPlaceLicense('bottom-right')">Kanan Bawah</button>
      <button class="btn btn-cyan" onclick="autoPlaceLicense('bottom-left')">Kiri Bawah</button>
    </div>

    <div class="inline-tool-box">
      <span style="font-size:0.7rem; color:#94a3b8;">Buat BG Polosan:</span>
      <select id="bgShapeType" class="inline-input" style="flex: initial; width: 110px;">
        <option value="rect">Persegi</option>
        <option value="rounded">Rounded</option>
        <option value="circle">Lingkaran</option>
        <option value="ellipse">Oval</option>
      </select>
      <input type="color" id="bgColorPicker" value="#ffffff" title="Warna Latar">
      <button class="btn btn-green" onclick="generateCustomBgShape()">Buat Latar</button>
    </div>

    <div style="margin-top: 8px;">
      <canvas id="mainCanvas" width="500" height="250"></canvas>
    </div>

    <div class="control-panel">
      <div class="dpad-group">
        <span style="font-size: 0.68rem; color: #94a3b8; margin-bottom: 2px;">Geser Presisi</span>
        <div class="dpad-row">
          <button class="btn btn-dpad" id="btnUp">⬆️</button>
        </div>
        <div class="dpad-row">
          <button class="btn btn-dpad" id="btnLeft">⬅️</button>
          <button class="btn btn-dpad" id="btnDown">⬇️</button>
          <button class="btn btn-dpad" id="btnRight">➡️</button>
        </div>
      </div>

      <div class="action-group">
        <span style="font-size: 0.68rem; color: #94a3b8; text-align: center;">Ukuran & Rotasi</span>
        <div class="action-row">
          <button class="btn btn-action" id="btnScaleUp">➕ Perbesar</button>
          <button class="btn btn-action" id="btnScaleDown">➖ Perkecil</button>
        </div>
        <div class="action-row">
          <button class="btn btn-action" id="btnRotateCCW">🔄 Putar Kiri</button>
          <button class="btn btn-action" id="btnRotateCW">🔁 Putar Kanan</button>
        </div>
      </div>
    </div>
  </div>

  <div class="section-box">
    <h3>2. MEJA POTONG & OLAH GAMBAR (STAGING AREA)</h3>
    
    <div class="gallery-container">
      <div class="gallery-title">
        <span>📁 Penyimpanan Aset Gambar Lokal</span>
        <span id="assetCount">0 Aset</span>
      </div>
      <div class="gallery-grid" id="assetGallery"></div>
    </div>

    <div class="toolbar">
      <label class="btn btn-purple">
        + Multi Gambar <input type="file" id="loadStagingMultiImg" accept="image/*" multiple hidden>
      </label>
      <button class="btn" onclick="addStagingText()">+ Teks Seni</button>
      <button class="btn btn-ai" onclick="autoRemoveBgAI()">🤖 AI Hapus BG</button>
      <button class="btn btn-orange" onclick="enableColorPicker()">🧪 Pipet Warna</button>
      
      <div class="color-picker-wrapper">
        <input type="color" id="removeColor" value="#ffffff">
      </div>
      <button class="btn btn-red" onclick="removeBackgroundStaging()">🪄 Hapus BG Warna</button>

      <button class="btn btn-green" onclick="showCropOverlay('circle')">🎯 Panduan Lingkaran 1:1</button>
      <button class="btn btn-green" onclick="showCropOverlay('square')">🎯 Panduan Persegi 1:1</button>
      <button class="btn btn-green" onclick="showCropOverlay('rounded')">🎯 Panduan Lengkung 1:1</button>
      
      <button class="btn btn-orange" id="btnLockCrop" onclick="toggleLockCropOverlay()">🔒 Kunci Panduan</button>
      <button class="btn btn-pink" onclick="applyNativeCrop()">✂️ Eksekusi Potong Presisi</button>
    </div>

    <div class="inline-tool-box">
      <input type="text" id="licenseCodeInput" class="inline-input" placeholder="ID Lisensi (misal: LIC-ICP2E-001)">
      <button class="btn btn-cyan" onclick="generateLicenseStamp()">📜 + Stempel Lisensi</button>
    </div>

    <div class="inline-tool-box">
      <input type="text" id="stampPriceValue" class="inline-input" placeholder="Price (Contoh: 15.000 / 50)">
      <button class="btn btn-pink" onclick="generatePriceStamp()">🏷️ Stempel Price</button>
    </div>

    <div class="inline-tool-box">
      <input type="text" id="barcodeValue" class="inline-input" placeholder="Isi Angka Barcode/PIRT/BPOM">
      <button class="btn btn-zoom" onclick="generateSafeBarcode()">📊 + Barcode Aman Scan</button>
    </div>

    <button class="btn btn-purple" style="width:100%; margin-top:8px;" onclick="sendToMain()">
      ⬆️ Masukkan Elemen Terpilih ke Kotak Sakti / Lisensi / Kanvas
    </button>

    <div style="margin-top: 8px;">
      <canvas id="stagingCanvas" width="500" height="200"></canvas>
    </div>
  </div>

  <canvas id="barcodeHiddenCanvas" style="display:none;"></canvas>

  <script>
    const mainCanvas = new fabric.Canvas('mainCanvas', { backgroundColor: '#ffffff', preserveObjectStacking: true });
    const stagingCanvas = new fabric.Canvas('stagingCanvas', { backgroundColor: '#f8fafc', preserveObjectStacking: true });

    let currentZoom = 1;
    let pickColorMode = false;
    let currentMainBgImage = null;
    let localAssets = [];
    let cropOverlayObj = null;

    // ==========================================
    // 1. DASHBOARD & AUTO-SAVE STATE
    // ==========================================
    function initUserCounter() {
      let count = localStorage.getItem('label_studio_user_count') || Math.floor(Math.random() * 12) + 15;
      document.getElementById('userCount').innerText = count;
      localStorage.setItem('label_studio_user_count', count);
    }

    function saveProjectState() {
      try {
        const mainData = JSON.stringify(mainCanvas.toJSON(['isMagicBox', 'isLicenseBox', 'isGeneratedBg']));
        const stagingData = JSON.stringify(stagingCanvas.toJSON(['isCropOverlay', 'cropShapeType', 'targetImageObj']));
        localStorage.setItem('label_studio_main', mainData);
        localStorage.setItem('label_studio_staging', stagingData);
        localStorage.setItem('label_studio_assets', JSON.stringify(localAssets));
      } catch (e) {
        console.warn("Progres gagal disimpan otomatis:", e);
      }
    }

    function loadProjectState() {
      const savedMain = localStorage.getItem('label_studio_main');
      const savedStaging = localStorage.getItem('label_studio_staging');
      const savedAssets = localStorage.getItem('label_studio_assets');

      if (savedAssets) {
        try { localAssets = JSON.parse(savedAssets); } catch(e) { localAssets = []; }
        renderGallery();
      }

      if (savedMain) {
        mainCanvas.loadFromJSON(savedMain, function() {
          mainCanvas.getObjects().forEach(obj => {
            if (obj.isMagicBox || obj.isLicenseBox) attachMagicBoxEvents(obj);
          });
          mainCanvas.renderAll();
        });
      }
      if (savedStaging) {
        stagingCanvas.loadFromJSON(savedStaging, function() {
          stagingCanvas.renderAll();
        });
      }
      initUserCounter();
    }

    function clearProjectData() {
      if (confirm("Yakin ingin menghapus seluruh progres dan mulai dari awal?")) {
        localStorage.removeItem('label_studio_main');
        localStorage.removeItem('label_studio_staging');
        localStorage.removeItem('label_studio_assets');
        location.reload();
      }
    }

    mainCanvas.on('object:modified', saveProjectState);
    mainCanvas.on('object:added', saveProjectState);
    mainCanvas.on('object:removed', saveProjectState);
    stagingCanvas.on('object:modified', saveProjectState);
    stagingCanvas.on('object:added', saveProjectState);
    stagingCanvas.on('object:removed', saveProjectState);

    // ==========================================
    // 2. GENERATOR LATAR & STEMPEL LISENSI
    // ==========================================
    function generateCustomBgShape() {
      const shapeType = document.getElementById('bgShapeType').value;
      const color = document.getElementById('bgColorPicker').value;
      
      let bgObj;
      const w = mainCanvas.width;
      const h = mainCanvas.height;

      if (shapeType === 'rect') {
        bgObj = new fabric.Rect({ width: w, height: h, fill: color });
      } else if (shapeType === 'rounded') {
        bgObj = new fabric.Rect({ width: w - 20, height: h - 20, rx: 25, ry: 25, fill: color, left: 10, top: 10 });
      } else if (shapeType === 'circle') {
        bgObj = new fabric.Circle({ radius: Math.min(w, h) / 2 - 10, fill: color, left: w/2, top: h/2, originX: 'center', originY: 'center' });
      } else if (shapeType === 'ellipse') {
        bgObj = new fabric.Ellipse({ rx: w / 2 - 15, ry: h / 2 - 15, fill: color, left: w/2, top: h/2, originX: 'center', originY: 'center' });
      }

      bgObj.set({ selectable: false, evented: false });
      mainCanvas.setBackgroundImage(null, mainCanvas.renderAll.bind(mainCanvas));
      
      const existingBg = mainCanvas.getObjects().find(o => o.isGeneratedBg);
      if (existingBg) mainCanvas.remove(existingBg);

      bgObj.isGeneratedBg = true;
      mainCanvas.add(bgObj);
      mainCanvas.sendToBack(bgObj);
      mainCanvas.renderAll();
      saveProjectState();
    }

    function generateLicenseStamp() {
      const code = document.getElementById('licenseCodeInput').value.trim() || 'LIC-VERIFIED';

      const rect = new fabric.Rect({
        width: 120, height: 34, rx: 6, ry: 6, fill: '#06b6d4', stroke: '#0284c7', strokeWidth: 1.5, originX: 'center', originY: 'center'
      });

      const iconText = new fabric.Text("🛡️ " + code, {
        fontSize: 10, fontWeight: 'bold', fill: '#ffffff', originX: 'center', originY: 'center'
      });

      const stampGroup = new fabric.Group([rect, iconText], {
        left: 70, top: 50, originX: 'center', originY: 'center'
      });

      stagingCanvas.add(stampGroup);
      stagingCanvas.setActiveObject(stampGroup);
      stagingCanvas.renderAll();
      saveProjectState();
    }

    // ==========================================
    // 3. STEMPEL PRICE & BARCODE
    // ==========================================
    function generatePriceStamp() {
      const val = document.getElementById('stampPriceValue').value.trim();
      if (!val) {
        alert("Masukkan nilai harga terlebih dahulu!");
        return;
      }

      const circle = new fabric.Circle({
        radius: 40, fill: '#ffffff', stroke: '#ec4899', strokeWidth: 3, originX: 'center', originY: 'center'
      });

      const labelText = new fabric.Text("PRICE", {
        fontSize: 11, fontWeight: 'bold', fill: '#ec4899', originX: 'center', originY: 'center', top: -16
      });

      const priceText = new fabric.Text(val, {
        fontSize: 14, fontWeight: 'bold', fill: '#0f172a', originX: 'center', originY: 'center', top: 6
      });

      const stampGroup = new fabric.Group([circle, labelText, priceText], {
        left: 80, top: 80, originX: 'center', originY: 'center'
      });

      stagingCanvas.add(stampGroup);
      stagingCanvas.setActiveObject(stampGroup);
      stagingCanvas.renderAll();
      saveProjectState();
    }

    function generateSafeBarcode() {
      const val = document.getElementById('barcodeValue').value.trim();
      if (!val) {
        alert("Masukkan kode angka untuk Barcode!");
        return;
      }

      const hiddenCanvas = document.getElementById('barcodeHiddenCanvas');
      
      try {
        JsBarcode(hiddenCanvas, val, {
          format: "CODE128", lineColor: "#000000", background: "#ffffff",
          width: 2, height: 50, displayValue: true, fontSize: 12, margin: 10
        });

        const dataURL = hiddenCanvas.toDataURL('image/png');
        fabric.Image.fromURL(dataURL, function(img) {
          img.set({ left: 60, top: 60 });
          stagingCanvas.add(img);
          stagingCanvas.setActiveObject(img);
          stagingCanvas.renderAll();
          saveProjectState();
        }, { crossOrigin: 'anonymous' });
      } catch (e) {
        alert("Format karakter Barcode tidak valid.");
      }
    }

    // ==========================================
    // 4. RATAKAN BG & ASET GUDANG
    // ==========================================
    function autoFlattenBg() {
      const bg = mainCanvas.backgroundImage || currentMainBgImage;
      if (!bg) {
        alert("Upload atau pilih gambar Background terlebih dahulu!");
        return;
      }
      
      const scaleX = mainCanvas.width / bg.width;
      const scaleY = mainCanvas.height / bg.height;

      bg.set({
        scaleX: scaleX, scaleY: scaleY,
        left: 0, top: 0, originX: 'left', originY: 'top', angle: 0
      });

      mainCanvas.setBackgroundImage(bg, () => {
        mainCanvas.renderAll();
        saveProjectState();
        alert("Label berhasil diratakan penuh!");
      });
    }

    document.getElementById('loadMainBg').addEventListener('change', function(e) {
      if (!e.target.files[0]) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        fabric.Image.fromURL(event.target.result, function(img) {
          currentMainBgImage = img;
          autoFlattenBg();
        }, { crossOrigin: 'anonymous' });
      };
      reader.readAsDataURL(e.target.files[0]);
    });

    document.getElementById('loadStagingMultiImg').addEventListener('change', function(e) {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      let loadedCount = 0;
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = function(event) {
          const dataUrl = event.target.result;
          localAssets.push(dataUrl);
          
          if (loadedCount === 0) loadImageToStaging(dataUrl);
          loadedCount++;
          if (loadedCount === files.length) {
            renderGallery();
            saveProjectState();
          }
        };
        reader.readAsDataURL(file);
      });
    });

    function renderGallery() {
      const galleryEl = document.getElementById('assetGallery');
      const countEl = document.getElementById('assetCount');
      galleryEl.innerHTML = '';
      countEl.innerText = `${localAssets.length} Aset`;

      localAssets.forEach((dataUrl, index) => {
        const item = document.createElement('div');
        item.className = 'gallery-item';
        
        const img = document.createElement('img');
        img.src = dataUrl;
        img.onclick = () => loadImageToStaging(dataUrl);

        const delBtn = document.createElement('button');
        delBtn.className = 'btn-del-asset';
        delBtn.innerHTML = '✕';
        delBtn.onclick = (e) => {
          e.stopPropagation();
          deleteAsset(index);
        };

        item.appendChild(img);
        item.appendChild(delBtn);
        galleryEl.appendChild(item);
      });
    }

    function loadImageToStaging(dataUrl) {
      fabric.Image.fromURL(dataUrl, function(img) {
        img.scaleToWidth(130);
        img.set({ left: stagingCanvas.width/2, top: stagingCanvas.height/2, originX: 'center', originY: 'center' });
        stagingCanvas.add(img);
        stagingCanvas.setActiveObject(img);
        stagingCanvas.renderAll();
      }, { crossOrigin: 'anonymous' });
    }

    function deleteAsset(index) {
      localAssets.splice(index, 1);
      renderGallery();
      saveProjectState();
    }

    // ==========================================
    // 5. CONTROL PANEL D-PAD & SAMAKAN UKURAN
    // ==========================================
    function bindContinuousControl(buttonId, actionFunction) {
      const btn = document.getElementById(buttonId);
      let timer = null;

      const start = (e) => {
        if (e.cancelable) e.preventDefault();
        actionFunction();
        timer = setInterval(actionFunction, 50);
      };

      const stop = () => {
        if (timer) clearInterval(timer);
        timer = null;
        saveProjectState();
      };

      btn.addEventListener('mousedown', start);
      btn.addEventListener('mouseup', stop);
      btn.addEventListener('mouseleave', stop);
      btn.addEventListener('touchstart', start, { passive: false });
      btn.addEventListener('touchend', stop);
    }

    function moveSelected(dx, dy) {
      const obj = mainCanvas.getActiveObject();
      if (!obj) return;
      obj.set({ left: obj.left + dx, top: obj.top + dy });
      obj.setCoords();
      mainCanvas.renderAll();
    }

    function scaleSelected(factor) {
      const obj = mainCanvas.getActiveObject();
      if (!obj) return;
      obj.scale(obj.scaleX * factor);
      obj.setCoords();
      mainCanvas.renderAll();
    }

    function rotateSelected(angle) {
      const obj = mainCanvas.getActiveObject();
      if (!obj) return;
      obj.set('angle', obj.angle + angle);
      obj.setCoords();
      mainCanvas.renderAll();
    }

    function equalizeSelectedSizes() {
      const activeObj = mainCanvas.getActiveObject();
      if (!activeObj || activeObj.type !== 'activeSelection') {
        alert("Pilih minimal 2 objek di Kanvas Utama (gunakan Shift + Klik)!");
        return;
      }

      const objects = activeObj.getObjects();
      if (objects.length < 2) return;

      const baseWidth = objects[0].getScaledWidth();
      const baseHeight = objects[0].getScaledHeight();

      for (let i = 1; i < objects.length; i++) {
        const target = objects[i];
        target.set({
          scaleX: baseWidth / target.width,
          scaleY: baseHeight / target.height
        });
        target.setCoords();
      }

      mainCanvas.renderAll();
      saveProjectState();
      alert(`Ukuran disamakan: ${Math.round(baseWidth)}px x ${Math.round(baseHeight)}px`);
    }

    bindContinuousControl('btnUp', () => moveSelected(0, -2));
    bindContinuousControl('btnDown', () => moveSelected(0, 2));
    bindContinuousControl('btnLeft', () => moveSelected(-2, 0));
    bindContinuousControl('btnRight', () => moveSelected(2, 0));
    bindContinuousControl('btnScaleUp', () => scaleSelected(1.02));
    bindContinuousControl('btnScaleDown', () => scaleSelected(0.98));
    bindContinuousControl('btnRotateCCW', () => rotateSelected(-2));
    bindContinuousControl('btnRotateCW', () => rotateSelected(2));

    // ==========================================
    // 6. KOTAK SAKTI & KOTAK LISENSI
    // ==========================================
    function attachMagicBoxEvents(box) {
      let lastClickTime = 0;
      box.on('mousedown', function() {
        const currentTime = new Date().getTime();
        if (currentTime - lastClickTime < 300) {
          duplicateMainObj();
        }
        lastClickTime = currentTime;
      });
    }

    function addMagicBox() {
      const rect = new fabric.Rect({
        width: 120, height: 120,
        fill: 'rgba(236, 72, 153, 0.1)', stroke: '#ec4899', strokeWidth: 2,
        strokeDashArray: [6, 6], originX: 'center', originY: 'center'
      });
      const plusText = new fabric.Text('+', {
        fontSize: 26, fill: '#ec4899', originX: 'center', originY: 'center', fontWeight: 'bold'
      });
      const magicBox = new fabric.Group([rect, plusText], {
        left: mainCanvas.width / 2, top: mainCanvas.height / 2,
        originX: 'center', originY: 'center', centeredScaling: true,
        transparentCorners: false, cornerColor: '#ec4899', cornerStyle: 'circle'
      });

      magicBox.isMagicBox = true;
      attachMagicBoxEvents(magicBox);

      mainCanvas.add(magicBox);
      mainCanvas.setActiveObject(magicBox);
      mainCanvas.renderAll();
    }

    function addLicenseBox() {
      const rect = new fabric.Rect({
        width: 90, height: 45,
        fill: 'rgba(6, 182, 212, 0.15)', stroke: '#06b6d4', strokeWidth: 2,
        strokeDashArray: [4, 4], originX: 'center', originY: 'center', rx: 4, ry: 4
      });
      const labelText = new fabric.Text('📜 Lisensi', {
        fontSize: 12, fill: '#06b6d4', originX: 'center', originY: 'center', fontWeight: 'bold'
      });
      const licenseBox = new fabric.Group([rect, labelText], {
        left: mainCanvas.width - 70, top: 40,
        originX: 'center', originY: 'center', centeredScaling: true,
        transparentCorners: false, cornerColor: '#06b6d4', cornerStyle: 'circle'
      });

      licenseBox.isLicenseBox = true;
      attachMagicBoxEvents(licenseBox);

      mainCanvas.add(licenseBox);
      mainCanvas.setActiveObject(licenseBox);
      mainCanvas.renderAll();
    }

    function autoPlaceLicense(position) {
      let targetBox = mainCanvas.getObjects().find(o => o.isLicenseBox);
      if (!targetBox) {
        addLicenseBox();
        targetBox = mainCanvas.getActiveObject();
      }

      const w = mainCanvas.width;
      const h = mainCanvas.height;

      if (position === 'top-right') {
        targetBox.set({ left: w - 60, top: 35 });
      } else if (position === 'bottom-right') {
        targetBox.set({ left: w - 60, top: h - 35 });
      } else if (position === 'bottom-left') {
        targetBox.set({ left: 60, top: h - 35 });
      }

      targetBox.setCoords();
      mainCanvas.renderAll();
      saveProjectState();
    }

    function duplicateMainObj() {
      const activeObj = mainCanvas.getActiveObject();
      if (!activeObj) {
        alert("Pilih elemen terlebih dahulu!");
        return;
      }

      activeObj.clone(function(clonedObj) {
        clonedObj.set({
          left: activeObj.left + 20,
          top: activeObj.top + 20,
          evented: true
        });

        if (activeObj.isMagicBox) {
          clonedObj.isMagicBox = true;
          attachMagicBoxEvents(clonedObj);
        } else if (activeObj.isLicenseBox) {
          clonedObj.isLicenseBox = true;
          attachMagicBoxEvents(clonedObj);
        }

        mainCanvas.add(clonedObj);
        mainCanvas.setActiveObject(clonedObj);
        mainCanvas.renderAll();
      });
    }

    function sendToMain() {
      const activeStagingObj = stagingCanvas.getActiveObject();
      if (!activeStagingObj || activeStagingObj.isCropOverlay) {
        alert("Pilih elemen di Meja Potong terlebih dahulu!");
        return;
      }

      const activeMainObj = mainCanvas.getActiveObject();

      activeStagingObj.clone(function(clonedObj) {
        if (activeMainObj && (activeMainObj.isMagicBox || activeMainObj.isLicenseBox)) {
          const targetWidth = activeMainObj.getScaledWidth();
          const targetHeight = activeMainObj.getScaledHeight();
          const targetLeft = activeMainObj.left;
          const targetTop = activeMainObj.top;

          const scaleX = targetWidth / clonedObj.width;
          const scaleY = targetHeight / clonedObj.height;
          const finalScale = Math.min(scaleX, scaleY);

          clonedObj.set({
            left: targetLeft, top: targetTop,
            scaleX: finalScale, scaleY: finalScale,
            originX: 'center', originY: 'center'
          });

          mainCanvas.remove(activeMainObj);
        } else {
          clonedObj.set({
            left: mainCanvas.width / 2, top: mainCanvas.height / 2,
            originX: 'center', originY: 'center'
          });
        }

        mainCanvas.add(clonedObj);
        mainCanvas.setActiveObject(clonedObj);
        mainCanvas.renderAll();
      });
    }

    // ==========================================
    // 7. PEMOTONGAN PRESISI BERBASIS CANVAS NATIVE
    // ==========================================
    function showCropOverlay(shapeType) {
      const activeObj = stagingCanvas.getActiveObject();
      if (!activeObj || activeObj.type !== 'image') {
        alert("Aktifkan/Klik gambar di Meja Potong terlebih dahulu!");
        return;
      }

      if (cropOverlayObj) stagingCanvas.remove(cropOverlayObj);

      const center = activeObj.getCenterPoint();
      const bounds = activeObj.getBoundingRect();
      const size = Math.min(bounds.width, bounds.height) * 0.7;

      let frameShape;
      if (shapeType === 'circle') {
        frameShape = new fabric.Circle({
          radius: size / 2, fill: 'rgba(16, 185, 129, 0.25)',
          stroke: '#10b981', strokeWidth: 2, strokeDashArray: [4, 4],
          originX: 'center', originY: 'center'
        });
      } else if (shapeType === 'square') {
        frameShape = new fabric.Rect({
          width: size, height: size, fill: 'rgba(16, 185, 129, 0.25)',
          stroke: '#10b981', strokeWidth: 2, strokeDashArray: [4, 4],
          originX: 'center', originY: 'center'
        });
      } else if (shapeType === 'rounded') {
        frameShape = new fabric.Rect({
          width: size, height: size, rx: 20, ry: 20, fill: 'rgba(16, 185, 129, 0.25)',
          stroke: '#10b981', strokeWidth: 2, strokeDashArray: [4, 4],
          originX: 'center', originY: 'center'
        });
      }

      frameShape.set({
        left: center.x, top: center.y,
        cornerColor: '#10b981', cornerStyle: 'circle', transparentCorners: false, lockUniScaling: true
      });

      frameShape.isCropOverlay = true;
      frameShape.cropShapeType = shapeType;
      frameShape.targetImageObj = activeObj;

      cropOverlayObj = frameShape;
      stagingCanvas.add(cropOverlayObj);
      stagingCanvas.setActiveObject(cropOverlayObj);
      stagingCanvas.renderAll();
      
      const lockBtn = document.getElementById('btnLockCrop');
      lockBtn.innerText = "🔒 Kunci Panduan";
      lockBtn.classList.remove('btn-red');
      lockBtn.classList.add('btn-orange');
    }

    function toggleLockCropOverlay() {
      if (!cropOverlayObj) {
        alert("Aktifkan panduan potong terlebih dahulu!");
        return;
      }

      const isLocked = !cropOverlayObj.lockMovementX;
      cropOverlayObj.set({
        lockMovementX: isLocked, lockMovementY: isLocked,
        lockScalingX: isLocked, lockScalingY: isLocked, lockRotation: isLocked
      });

      const lockBtn = document.getElementById('btnLockCrop');
      if (isLocked) {
        lockBtn.innerText = "🔓 Buka Kunci";
        lockBtn.classList.remove('btn-orange');
        lockBtn.classList.add('btn-red');
      } else {
        lockBtn.innerText = "🔒 Kunci Panduan";
        lockBtn.classList.remove('btn-red');
        lockBtn.classList.add('btn-orange');
      }

      stagingCanvas.renderAll();
    }

    function applyNativeCrop() {
      if (!cropOverlayObj || !cropOverlayObj.targetImageObj) {
        alert("Buat/Aktifkan panduan potong terlebih dahulu!");
        return;
      }

      const imgObj = cropOverlayObj.targetImageObj;
      const overlay = cropOverlayObj;

      // Sembunyikan garis panduan saat melakukan rasterization
      overlay.set('visible', false);
      stagingCanvas.renderAll();

      const imgBounds = imgObj.getBoundingRect(true);
      const cropBounds = overlay.getBoundingRect(true);

      // Hitung koordinat potong pada elemen image asli
      const element = imgObj._element;
      const scaleX = element.naturalWidth / imgBounds.width;
      const scaleY = element.naturalHeight / imgBounds.height;

      const cropX = (cropBounds.left - imgBounds.left) * scaleX;
      const cropY = (cropBounds.top - imgBounds.top) * scaleY;
      const cropW = cropBounds.width * scaleX;
      const cropH = cropBounds.height * scaleY;

      // Kanvas sementara (Native HTML5 Canvas)
      const tempCanvas = document.createElement('canvas');
      const tempCtx = tempCanvas.getContext('2d');
      tempCanvas.width = cropW;
      tempCanvas.height = cropH;

      tempCtx.beginPath();
      if (overlay.cropShapeType === 'circle') {
        tempCtx.arc(cropW / 2, cropH / 2, Math.min(cropW, cropH) / 2, 0, Math.PI * 2);
      } else if (overlay.cropShapeType === 'rounded') {
        const r = Math.min(cropW, cropH) * 0.15;
        tempCtx.roundRect(0, 0, cropW, cropH, r);
      } else {
        tempCtx.rect(0, 0, cropW, cropH);
      }
      tempCtx.closePath();
      tempCtx.clip();

      // Gambar bagian aset yang dipotong
      tempCtx.drawImage(element, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

      const croppedDataUrl = tempCanvas.toDataURL('image/png');

      // Ganti objek di Meja Potong dengan versi terpotong
      fabric.Image.fromURL(croppedDataUrl, function(newImg) {
        newImg.set({
          left: overlay.left,
          top: overlay.top,
          originX: 'center',
          originY: 'center'
        });

        stagingCanvas.remove(imgObj);
        stagingCanvas.remove(overlay);
        cropOverlayObj = null;

        stagingCanvas.add(newImg);
        stagingCanvas.setActiveObject(newImg);
        stagingCanvas.renderAll();
        saveProjectState();
        alert("Pemotongan berhasil! Siap dikirim ke Kanvas Utama.");
      }, { crossOrigin: 'anonymous' });
    }

    // ==========================================
    // 8. OLAH GAMBAR UTILS & PIPET WARNA
    // ==========================================
    async function autoRemoveBgAI() {
      const activeObj = stagingCanvas.getActiveObject();
      if (!activeObj || activeObj.type !== 'image') {
        alert("Pilih gambar di Meja Potong terlebih dahulu!");
        return;
      }

      const originalElement = activeObj._element;
      if (!originalElement) return;

      const tempCanvas = document.createElement('canvas');
      const tempCtx = tempCanvas.getContext('2d');
      tempCanvas.width = originalElement.naturalWidth || originalElement.width;
      tempCanvas.height = originalElement.naturalHeight || originalElement.height;
      
      try {
        tempCtx.drawImage(originalElement, 0, 0);
        const imgData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
        const data = imgData.data;

        const corners = [
          0, (tempCanvas.width - 1) * 4,
          (tempCanvas.height - 1) * tempCanvas.width * 4,
          ((tempCanvas.height - 1) * tempCanvas.width + (tempCanvas.width - 1)) * 4
        ];

        let bgR = 0, bgG = 0, bgB = 0;
        corners.forEach(idx => {
          bgR += data[idx]; bgG += data[idx + 1]; bgB += data[idx + 2];
        });
        bgR = Math.round(bgR / 4); bgG = Math.round(bgG / 4); bgB = Math.round(bgB / 4);

        const threshold = 60;
        for (let i = 0; i < data.length; i += 4) {
          const r = data[i], g = data[i + 1], b = data[i + 2];
          const diff = Math.sqrt((r - bgR) ** 2 + (g - bgG) ** 2 + (b - bgB) ** 2);
          if (diff < threshold) data[i + 3] = 0;
        }

        tempCtx.putImageData(imgData, 0, 0);

        fabric.Image.fromURL(tempCanvas.toDataURL(), function(newImg) {
          newImg.set({
            left: activeObj.left, top: activeObj.top,
            scaleX: activeObj.scaleX, scaleY: activeObj.scaleY, angle: activeObj.angle,
            originX: 'center', originY: 'center'
          });
          stagingCanvas.remove(activeObj);
          stagingCanvas.add(newImg);
          stagingCanvas.setActiveObject(newImg);
          stagingCanvas.renderAll();
        }, { crossOrigin: 'anonymous' });
      } catch(e) {
        alert("Gagal menghapus background secara otomatis.");
      }
    }

    function enableColorPicker() {
      pickColorMode = true;
      alert("Klik titik warna pada Meja Potong!");
    }

    stagingCanvas.on('mouse:down', function(options) {
      if (!pickColorMode) return;
      const pointer = stagingCanvas.getPointer(options.e);
      const ctx = stagingCanvas.getContext();
      const pixel = ctx.getImageData(Math.round(pointer.x), Math.round(pointer.y), 1, 1).data;
      const hexColor = "#" + ((1 << 24) + (pixel[0] << 16) + (pixel[1] << 8) + pixel[2]).toString(16).slice(1);
      document.getElementById('removeColor').value = hexColor;
      pickColorMode = false;
      removeBackgroundStaging();
    });

    function removeBackgroundStaging() {
      const activeObj = stagingCanvas.getActiveObject();
      if (!activeObj || activeObj.type !== 'image') return;
      const targetColor = document.getElementById('removeColor').value;
      const removeColorFilter = new fabric.Image.filters.RemoveColor({
        color: targetColor, distance: 0.2
      });
      activeObj.filters = [removeColorFilter];
      activeObj.applyFilters();
      stagingCanvas.renderAll();
    }

    function zoomMain(factor) {
      currentZoom *= factor;
      if (currentZoom < 0.5) currentZoom = 0.5;
      if (currentZoom > 4) currentZoom = 4;
      const center = mainCanvas.getCenter();
      mainCanvas.zoomToPoint({ x: center.left, y: center.top }, currentZoom);
      mainCanvas.renderAll();
    }

    function resetZoomMain() {
      currentZoom = 1;
      mainCanvas.setViewportTransform([1, 0, 0, 1, 0, 0]);
      mainCanvas.renderAll();
    }

    function addStagingText() {
      const txt = prompt("Masukkan Teks Seni:", "Varian Rasa");
      if (!txt) return;
      const textObj = new fabric.IText(txt, {
        left: stagingCanvas.width/2, top: stagingCanvas.height/2, fontSize: 24, fill: '#ff0000',
        fontWeight: 'bold', stroke: '#000000', strokeWidth: 1, originX: 'center', originY: 'center'
      });
      stagingCanvas.add(textObj);
      stagingCanvas.setActiveObject(textObj);
      stagingCanvas.renderAll();
    }

    function mergeSelected() {
      const activeObj = mainCanvas.getActiveObject();
      if (!activeObj || activeObj.type !== 'activeSelection') return;
      activeObj.toGroup();
      mainCanvas.renderAll();
    }

    function unmergeSelected() {
      const activeObj = mainCanvas.getActiveObject();
      if (!activeObj || activeObj.type !== 'group') return;
      activeObj.toActiveSelection();
      mainCanvas.renderAll();
    }

    function deleteMainObj() {
      const activeObj = mainCanvas.getActiveObject();
      if (activeObj) {
        mainCanvas.remove(activeObj);
        mainCanvas.discardActiveObject();
        mainCanvas.renderAll();
      }
    }

    function exportPNG() {
      const tempZoom = currentZoom;
      resetZoomMain();
      const dataURL = mainCanvas.toDataURL({ format: 'png', quality: 1.0, multiplier: 2 });
      if (tempZoom !== 1) zoomMain(tempZoom);
      const link = document.createElement('a');
      link.download = 'label-desain-final.png';
      link.href = dataURL;
      link.click();
    }

    window.onload = loadProjectState;
  </script>

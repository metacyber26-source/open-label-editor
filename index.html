<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor Label Ultimate HD</title>
  <!-- Library Canvas & Cropper -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

  <style>
    :root {
      --bg-main: #0b1329;
      --card-bg: #16223b;
      --btn-purple: #6366f1;
      --btn-green: #10b981;
      --btn-pink: #ec4899;
      --btn-cyan: #06b6d4;
      --btn-orange: #f59e0b;
      --btn-red: #ef4444;
      --btn-dark-red: #dc2626;
      --text: #ffffff;
    }

    body {
      margin: 0;
      padding: 15px;
      background-color: var(--bg-main);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .app-layout {
      display: grid;
      grid-template-columns: 320px 1fr 320px;
      gap: 15px;
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid #233554;
      border-radius: 8px;
      padding: 12px;
    }

    h3 {
      font-size: 14px;
      margin-top: 0;
      margin-bottom: 10px;
      color: #93c5fd;
      border-bottom: 1px solid #233554;
      padding-bottom: 4px;
      text-transform: uppercase;
    }

    .btn-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    button {
      border: none;
      color: white;
      padding: 6px 10px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 11px;
      cursor: pointer;
    }

    .bg-purple { background: var(--btn-purple); }
    .bg-green { background: var(--btn-green); }
    .bg-pink { background: var(--btn-pink); }
    .bg-cyan { background: var(--btn-cyan); }
    .bg-orange { background: var(--btn-orange); }
    .bg-red { background: var(--btn-red); }
    .bg-dark-red { background: var(--btn-dark-red); }

    .control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 12px;
    }

    input, select {
      background: #0f172a;
      border: 1px solid #334155;
      color: white;
      padding: 4px;
      border-radius: 4px;
    }

    .cropper-box {
      width: 100%;
      height: 180px;
      background: #000;
      margin-bottom: 8px;
    }

    .canvas-container-outer {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #main-canvas {
      border: 1px solid #334155;
      background: #fff;
    }
  </style>
</head>
<body>

<div class="app-layout">

  <!-- LEFT: MEJA POTONG & BG -->
  <div class="panel">
    <h3>Meja Potong (Cropper)</h3>
    <input type="file" id="img-input" accept="image/*" style="width: 100%; margin-bottom: 8px;">
    
    <div class="cropper-box">
      <img id="cropper-img" src="" style="max-width: 100%; display: none;">
    </div>

    <div class="btn-grid">
      <button class="bg-green" id="btn-crop-send">Masukkan ke Kanvas</button>
      <button class="bg-red" id="btn-crop-clear">Hapus / Reset Meja Potong</button>
    </div>

    <h3>Buat BG Polosan</h3>
    <div class="control-row">
      <select id="bg-shape">
        <option value="circle">Lingkaran</option>
        <option value="square">Persegi</option>
      </select>
      <input type="color" id="bg-color-picker" value="#ffffff">
      <button class="bg-green" id="btn-make-bg">Buat Latar</button>
    </div>
    <div class="control-row">
      <label><input type="checkbox" id="bg-transparent-toggle"> Transparan Latar</label>
    </div>
  </div>

  <!-- CENTER: KANVAS UTAMA -->
  <div class="panel canvas-container-outer">
    <h3>1. KANVAS UTAMA (HASIL LABEL FINAL)</h3>
    
    <!-- Top Action Toolbar -->
    <div class="btn-grid">
      <button class="bg-purple" onclick="document.getElementById('bg-file').click()">+ Upload BG</button>
      <input type="file" id="bg-file" accept="image/*" style="display:none">
      <button class="bg-green" id="btn-align-straight">Ratakan Label</button>
      <button class="bg-pink" id="btn-add-sakti">✨ + Kotak Sakti</button>
      <button class="bg-cyan" id="btn-add-lisensi">📁 + Kotak Lisensi</button>
      <button class="bg-purple" id="btn-duplicate">📋 Duplikat</button>
      <button class="bg-cyan" id="btn-zoom-in">🔍 Zoom +</button>
      <button class="bg-cyan" id="btn-zoom-out">🔍 Zoom -</button>
      <button class="bg-orange" id="btn-reset-rot">↺ Reset</button>
      <button class="bg-orange" id="btn-same-size">🔔 Samakan Ukuran</button>
      <button class="bg-orange" id="btn-group">Gabung</button>
      <button class="bg-orange" id="btn-ungroup">Lepas</button>
      <button class="bg-red" id="btn-delete">Hapus</button>
      <button class="bg-dark-red" id="btn-clear-all">Reset</button>
    </div>

    <!-- Layering Controls -->
    <div class="btn-grid">
      <span style="font-size: 11px; align-self: center;">📚 Layering:</span>
      <button class="bg-purple" id="btn-front">🔝 Paling Depan</button>
      <button class="bg-purple" id="btn-up">⬆ Naik 1 Layer</button>
      <button class="bg-purple" id="btn-down">⬇ Turun 1 Layer</button>
      <button class="bg-purple" id="btn-back">🔝 Paling Belakang</button>
    </div>

    <!-- Auto Posisi Lisensi -->
    <div class="btn-grid">
      <span style="font-size: 11px; align-self: center;">📍 Auto Posisi Lisensi:</span>
      <button class="bg-cyan" id="pos-top-right">Kanan Atas</button>
      <button class="bg-cyan" id="pos-bottom-right">Kanan Bawah</button>
      <button class="bg-cyan" id="pos-bottom-left">Kiri Bawah</button>
    </div>

    <!-- Canvas -->
    <canvas id="main-canvas" width="450" height="450"></canvas>

    <!-- User Count Aktual -->
    <div style="margin-top: 10px; font-size: 12px; color: #94a3b8;">
      Pengguna/Objek Aktif: <b id="user-count">0</b>
    </div>

    <!-- Export -->
    <div style="margin-top: 10px; display: flex; gap: 10px; align-items: center;">
      <select id="export-quality">
        <option value="3">Ultra HD 300 DPI (Cetak)</option>
        <option value="1">Standard DPI</option>
      </select>
      <button class="bg-green" id="btn-download">💾 Unduh PNG HD</button>
    </div>
  </div>

  <!-- RIGHT: COLOR & STAMP OPTIONS -->
  <div class="panel">
    <h3>Stempel & Elemen Gambar</h3>
    <div class="control-row">
      <label>Transparansi Stempel:</label>
      <input type="range" id="stamp-opacity" min="0" max="1" step="0.05" value="1">
    </div>

    <h3>Teks / Angka / Huruf</h3>
    <button class="bg-purple" id="btn-add-text" style="width: 100%; margin-bottom: 8px;">+ Tambah Teks/Angka</button>
    
    <div class="control-row">
      <label>Warna Huruf:</label>
      <input type="color" id="text-color" value="#000000">
    </div>

    <div class="control-row">
      <label>Warna Dasaran Teks:</label>
      <input type="color" id="text-bg-color" value="#ffffff">
    </div>

    <div class="control-row">
      <label><input type="checkbox" id="text-bg-transparent" checked> Dasaran Transparan</label>
    </div>

    <div class="control-row">
      <label>Transparansi Huruf:</label>
      <input type="range" id="text-opacity" min="0" max="1" step="0.05" value="1">
    </div>
  </div>

</div>

<script>
  // Inisialisasi Canvas
  const canvas = new fabric.Canvas('main-canvas', { preserveObjectStacking: true });
  let cropper = null;

  // Update Jumlah Objek Aktual
  function updateObjCount() {
    document.getElementById('user-count').innerText = canvas.getObjects().length;
  }
  canvas.on('object:added', updateObjCount);
  canvas.on('object:removed', updateObjCount);

  // 1. MEJA POTONG (CROPPER LOGIC)
  const imgInput = document.getElementById('img-input');
  const cropImg = document.getElementById('cropper-img');

  imgInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (evt) => {
        cropImg.src = evt.target.result;
        cropImg.style.display = 'block';
        if (cropper) cropper.destroy();
        cropper = new Cropper(cropImg, { aspectRatio: NaN, viewMode: 1 });
      };
      reader.readAsDataURL(file);
    }
  });

  document.getElementById('btn-crop-clear').addEventListener('click', () => {
    if (cropper) {
      cropper.destroy();
      cropper = null;
    }
    cropImg.src = '';
    cropImg.style.display = 'none';
    imgInput.value = '';
  });

  // Kirim ke Kanvas Utama (Tegak Lurus & Auto Alignment)
  document.getElementById('btn-crop-send').addEventListener('click', () => {
    if (!cropper) return;
    const cvs = cropper.getCroppedCanvas();
    if (cvs) {
      fabric.Image.fromURL(cvs.toDataURL(), (img) => {
        img.set({
          angle: 0, // Dibuat tegak lurus
          left: canvas.width / 2,
          top: canvas.height / 2,
          originX: 'center',
          originY: 'center'
        });
        if (img.width > canvas.width * 0.6) img.scaleToWidth(canvas.width * 0.4);
        canvas.add(img);
        canvas.setActiveObject(img);
        canvas.renderAll();
      });
    }
  });

  // 2. KOTAK SAKTI & KOTAK LISENSI
  document.getElementById('btn-add-sakti').addEventListener('click', () => {
    const rect = new fabric.Rect({
      left: canvas.width / 2, top: canvas.height / 2,
      width: 80, height: 80, fill: '#f59e0b', stroke: '#ffffff', strokeWidth: 2,
      originX: 'center', originY: 'center', angle: 0
    });
    canvas.add(rect);
  });

  document.getElementById('btn-add-lisensi').addEventListener('click', () => {
    const group = new fabric.Group([
      new fabric.Rect({ width: 70, height: 70, fill: '#ffffff', stroke: '#0284c7', strokeWidth: 2 }),
      new fabric.Text('QR/PRO', { fontSize: 12, fill: '#0284c7', left: 10, top: 25 })
    ], { left: canvas.width - 90, top: canvas.height - 90, angle: 0 });
    canvas.add(group);
  });

  // 3. AUTO POSISI LISENSI
  document.getElementById('pos-top-right').addEventListener('click', () => {
    const obj = canvas.getActiveObject();
    if (obj) { obj.set({ left: canvas.width - (obj.width*obj.scaleX)/2 - 10, top: (obj.height*obj.scaleY)/2 + 10 }); canvas.renderAll(); }
  });
  document.getElementById('pos-bottom-right').addEventListener('click', () => {
    const obj = canvas.getActiveObject();
    if (obj) { obj.set({ left: canvas.width - (obj.width*obj.scaleX)/2 - 10, top: canvas.height - (obj.height*obj.scaleY)/2 - 10 }); canvas.renderAll(); }
  });
  document.getElementById('pos-bottom-left').addEventListener('click', () => {
    const obj = canvas.getActiveObject();
    if (obj) { obj.set({ left: (obj.width*obj.scaleX)/2 + 10, top: canvas.height - (obj.height*obj.scaleY)/2 - 10 }); canvas.renderAll(); }
  });

  // 4. RATAKAN & TEGAK LURUS SEMUA (RATAKAN LABEL)
  document.getElementById('btn-align-straight').addEventListener('click', () => {
    canvas.getObjects().forEach(o => {
      o.set({ angle: 0 });
      o.centerH();
    });
    canvas.renderAll();
  });

  // 5. UPLOAD BACKGROUND
  document.getElementById('bg-file').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (f) => {
        fabric.Image.fromURL(f.target.result, (img) => {
          canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas), {
            scaleX: canvas.width / img.width,
            scaleY: canvas.height / img.height
          });
        });
      };
      reader.readAsDataURL(file);
    }
  });

  // 6. DASARAN & WARNA
  document.getElementById('btn-make-bg').addEventListener('click', () => {
    const shape = document.getElementById('bg-shape').value;
    const color = document.getElementById('bg-color-picker').value;
    if (shape === 'square') {
      canvas.setBackgroundColor(color, canvas.renderAll.bind(canvas));
    } else {
      canvas.setBackgroundColor('transparent', canvas.renderAll.bind(canvas));
      const circle = new fabric.Circle({
        radius: canvas.width/2 - 5, fill: color, left: canvas.width/2, top: canvas.height/2, originX: 'center', originY: 'center'
      });
      canvas.add(circle);
      circle.sendToBack();
    }
  });

  document.getElementById('bg-transparent-toggle').addEventListener('change', (e) => {
    if (e.target.checked) canvas.setBackgroundColor('transparent', canvas.renderAll.bind(canvas));
  });

  // 7. KONTROL TEKS & STEMPEL
  document.getElementById('btn-add-text').addEventListener('click', () => {
    const txt = new fabric.IText('Teks Label', {
      left: canvas.width/2, top: canvas.height/2, originX: 'center', originY: 'center',
      fill: document.getElementById('text-color').value, angle: 0
    });
    canvas.add(txt);
    canvas.setActiveObject(txt);
  });

  document.getElementById('text-color').addEventListener('input', (e) => {
    const obj = canvas.getActiveObject();
    if (obj && (obj.type === 'i-text' || obj.type === 'text')) {
      obj.set('fill', e.target.value);
      canvas.renderAll();
    }
  });

  document.getElementById('text-bg-color').addEventListener('input', (e) => {
    const obj = canvas.getActiveObject();
    if (obj && !document.getElementById('text-bg-transparent').checked) {
      obj.set('textBackgroundColor', e.target.value);
      canvas.renderAll();
    }
  });

  document.getElementById('text-bg-transparent').addEventListener('change', (e) => {
    const obj = canvas.getActiveObject();
    if (obj) {
      obj.set('textBackgroundColor', e.target.checked ? 'transparent' : document.getElementById('text-bg-color').value);
      canvas.renderAll();
    }
  });

  document.getElementById('stamp-opacity').addEventListener('input', (e) => {
    const obj = canvas.getActiveObject();
    if (obj) { obj.set('opacity', parseFloat(e.target.value)); canvas.renderAll(); }
  });

  // 8. DOKUMEN LAINNYA & UNDUH HD
  document.getElementById('btn-duplicate').addEventListener('click', () => {
    const obj = canvas.getActiveObject();
    if (obj) obj.clone(cl => { cl.set({ left: cl.left+10, top: cl.top+10 }); canvas.add(cl); });
  });

  document.getElementById('btn-delete').addEventListener('click', () => {
    canvas.getActiveObjects().forEach(o => canvas.remove(o));
    canvas.discardActiveObject();
  });

  document.getElementById('btn-clear-all').addEventListener('click', () => canvas.clear());

  document.getElementById('btn-download').addEventListener('click', () => {
    const mult = parseInt(document.getElementById('export-quality').value);
    const link = document.createElement('a');
    link.download = 'label-final-hd.png';
    link.href = canvas.toDataURL({ format: 'png', multiplier: mult });
    link.click();
  });
</script>

</body>
</html>
